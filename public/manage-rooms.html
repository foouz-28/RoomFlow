<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rooms - RoomFlow Admin</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="manage-rooms">

  <header class="admin-header">
    <div class="container">
      <a class="brand" href="admin-dashboard.html">
        <img src="img/logo.svg" alt="RoomFlow" />
        <span class="brand-text">Room<b>Flow</b></span>
      </a>
      <nav class="admin-nav">
        <a href="admin-dashboard.html" data-i18n="dashboard">Dashboard</a>
        <a href="manage-bookings.html" data-i18n="manage_bookings">Bookings</a>
        <a href="waitlist.html" data-i18n="waiting_list">Waiting List</a>
        <a href="manage-rooms.html" class="active admin-only" data-i18n="manage_rooms">Rooms</a>
        <a href="manage-accounts.html" class="admin-only" data-i18n="manage_accounts">Accounts</a>
        <a href="verify.html" data-i18n="verify_nav">Verify QR</a>
        <button class="lang-btn">العربية</button>
        <a href="#" class="logout-btn" data-i18n="logout">Logout</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;" class="mb-2">
        <h2 data-i18n="rooms_admin_title">All Rooms</h2>
        <button id="addRoomBtn" class="btn btn-primary" data-i18n="add_room">+ Add Room</button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th data-i18n="col_name">Name</th>
              <th data-i18n="col_size">Size</th>
              <th data-i18n="col_capacity">Capacity</th>
              <th data-i18n="col_price">Price/hr</th>
              <th data-i18n="col_facilities">Facilities</th>
              <th data-i18n="col_status">Status</th>
              <th data-i18n="col_actions">Actions</th>
            </tr>
          </thead>
          <tbody id="roomsTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add / Edit Room Modal -->
  <div id="roomModal" class="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <h3 id="roomModalTitle" data-i18n="add_room_title">Add New Room</h3>
        <button id="closeRoomModal" class="btn btn-sm btn-ghost">✕</button>
      </div>

      <form id="roomForm">
        <div class="form-row">
          <div class="form-group"><label data-i18n="label_name_en">Name (English)</label><input type="text" id="roomNameEn" class="form-control" required /></div>
          <div class="form-group"><label data-i18n="label_name_ar">Name (Arabic)</label><input type="text" id="roomNameAr" class="form-control" required /></div>
        </div>
        <div class="form-group"><label data-i18n="col_size">Size</label><input type="text" id="roomSize" class="form-control" required /></div>
        <div class="form-row">
          <div class="form-group"><label data-i18n="col_capacity">Capacity</label><input type="number" id="roomCapacity" class="form-control" min="1" required /></div>
          <div class="form-group"><label data-i18n="col_price">Price/hr</label><input type="number" id="roomPrice" class="form-control" min="0" step="0.5" required /></div>
        </div>
        <div class="form-group"><label data-i18n="label_description">Description</label><textarea id="roomDescription" class="form-control"></textarea></div>
        <div class="form-group"><label data-i18n="label_facilities">Facilities (comma separated)</label><input type="text" id="roomFacilities" class="form-control" placeholder="Wi-Fi, Whiteboard, Projector" /></div>
        <div class="form-group"><label data-i18n="label_image">Image URL (optional)</label><input type="text" id="roomImage" class="form-control" /></div>
        <div class="form-group checkbox-row">
          <input type="checkbox" id="roomActive" checked />
          <label for="roomActive" style="margin:0;" data-i18n="label_active">Active (visible to public)</label>
        </div>
        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn-primary" data-i18n="save">Save</button>
          <button type="button" id="cancelRoomBtn" class="btn btn-ghost" data-i18n="cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
